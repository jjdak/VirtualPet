name: virtual-pet
version: "1.0.0"
description: Virtual pet management skill for creating and managing virtual pets in iOS applications
author: VirtualPet Studio
author_email: contact@virtualpet.studio
language: [swift]
target_platform: [ios]
category: mobile-app
subcategory: simulation
tags: [swiftui, ios, pet, simulation, game]
dependencies: []
frameworks: [SwiftUI, Foundation, Combine]
ios_minimum_version: "17.0"
swift_version: "5.0"

parameters:
  required: []
  optional:
    - name: pet_type
      type: string
      description: Type of pet (cat, dog, rabbit, hamster, bird)
      default: "cat"
      options: [cat, dog, rabbit, hamster, bird]
    - name: project_name
      type: string
      description: Name of the iOS project
      default: "VirtualPet"
    - name: bundle_id
      type: string
      description: Bundle identifier for the app
      default: "com.example.virtualpet"
    - name: deployment_target
      type: string
      description: iOS deployment target
      default: "17.0"
    - name: include_achievements
      type: boolean
      description: Include achievement system
      default: true
    - name: include_animations
      type: boolean
      description: Include animations and effects
      default: true
    - name: include_data_persistence
      type: boolean
      description: Include data persistence with UserDefaults
      default: true
    - name: include_activity_log
      type: boolean
      description: Include activity logging system
      default: true

templates:
  - templates/pet-model.swift
  - templates/pet-view.swift
  - templates/pet-viewcontroller.swift
  - templates/pet-app.swift
  - templates/pet-assets.json

generated_files:
  - Pet.swift
  - ContentView.swift
  - VirtualPetApp.swift
  - Assets.xcassets/AppIcon.appiconset/Contents.json
  - Assets.xcassets/AccentColor.colorset/Contents.json
  - Assets.xcassets/Contents.json

documentation:
  readme: docs/README.md
  api: docs/API.md
  examples: docs/examples.md

skills:
  - create-project
  - add-pet-feature
  - customize-pet
  - add-achievement
  - add-animation

commands:
  create-project: Create a new VirtualPet iOS project
  add-pet-feature: Add virtual pet features to existing project
  customize-pet: Customize pet type and behavior
  add-achievement: Add achievement system
  add-animation: Add animations and effects

capabilities:
  project_generation: true
  code_generation: true
  file_generation: true
  configuration: true
  template_expansion: true

license: MIT
repository:
  url: https://github.com/virtualpet-studio/virtual-pet-skill
  type: git

keywords: [ios, swift, swiftui, pet, virtual, game, mobile]
homepage: https://virtualpet.studio
bugs:
  url: https://github.com/virtualpet-studio/virtual-pet-skill/issues